name: test

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(node scripts/packages.mjs --json --with-engine)" >> "$GITHUB_OUTPUT"

  test:
    needs: packages
    runs-on: ubuntu-latest
    name: ${{ matrix.package }} on Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.list) }}
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs --package ${{ matrix.package }}
