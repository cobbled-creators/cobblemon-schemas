name: publish

on:
  push:
    tags: ['engine-v*', 'schemas-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm test

      - name: Work out the package and dist-tag
        id: release
        run: node scripts/release.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }} as ${{ steps.release.outputs.dist_tag }}
        working-directory: ${{ steps.release.outputs.dir }}
        run: npm publish --tag "${{ steps.release.outputs.dist_tag }}"
