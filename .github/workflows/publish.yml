name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            npm publish
          else
            npm publish --tag "cobblemon-$(node -p "require('./package.json').cobblemon.version")"
          fi
